# =============================================================================
# DfM Agent — docker-compose.yml
# One command:  docker compose up --build
# Judge opens:  http://localhost:5173  (React frontend-web UI — the demo)
#               http://localhost:8000/docs  (FastAPI backend, interactive API docs)
#
# This launches frontend-web/ (React + Three.js, F1-F6), NOT the legacy
# Streamlit UI. Dockerfile.frontend (Streamlit) and its "frontend" service
# definition were replaced by Dockerfile.frontend-web below; Streamlit can
# still be run manually (see README) but is no longer part of the Docker
# path.
# =============================================================================

# version: "3.9"

services:

  # ── Backend FastAPI service ──────────────────────────────────────────────
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: >
      uvicorn backend.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # Mount .stp files here
      - ./reports:/app/reports    # Generated DFM reports here
      - ./backend:/app/backend    # Live-reload during development
      - ./config.yaml:/app/config.yaml:ro  # Live config without image rebuild
      # Without this, `docker compose exec backend pytest tests/` runs
      # whatever tests/ tree was baked into the image at last build — a
      # stale, partial copy silently missing every test file added since
      # (found 2026-07-28: 6 of 12 test files were absent, so "pytest tests/"
      # was never exercising current source). Mirrors ./backend above.
      - ./tests:/app/tests
    environment:
      - DFM_CONFIG=/app/config.yaml
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      # Stage 5 (2026-07-28): provider-agnostic agent layer, Gemini default.
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend service — frontend-web (React + Three.js, F1-F6) ───────────
  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.frontend-web
    ports:
      - "5173:5173"
    environment:
      # Read server-side by the Vite dev server's proxy (vite.config.ts),
      # not by the browser -- the judge's browser only ever talks to
      # localhost:5173. "backend" resolves via Docker's internal network.
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  reports_data:
