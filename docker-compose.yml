# =============================================================================
# DfM Agent — docker-compose.yml
# One command:  docker compose up
# Judge/Bosch opens:  http://localhost:8501  (Streamlit UI)
#                     http://localhost:8000  (FastAPI backend docs)
# =============================================================================

# version: "3.9"

services:

  # ── Backend FastAPI service ──────────────────────────────────────────────
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: >
      uvicorn backend.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # Mount .stp files here
      - ./reports:/app/reports    # Generated DFM reports here
      - ./backend:/app/backend    # Live-reload during development
      - ./config.yaml:/app/config.yaml:ro  # Live config without image rebuild
      # Without this, `docker compose exec backend pytest tests/` runs
      # whatever tests/ tree was baked into the image at last build — a
      # stale, partial copy silently missing every test file added since
      # (found 2026-07-28: 6 of 12 test files were absent, so "pytest tests/"
      # was never exercising current source). Mirrors ./backend above.
      - ./tests:/app/tests
    environment:
      - DFM_CONFIG=/app/config.yaml
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      # Stage 5 (2026-07-28): provider-agnostic agent layer, Gemini default.
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend Streamlit service ───────────────────────────────────────────
  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command: >
      /bin/sh -lc "echo 'Starting Streamlit frontend on :8501';
      python -c 'import streamlit, requests; print(\"Frontend Python deps OK\")';
      xvfb-run -a streamlit run frontend/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --server.fileWatcherType=none"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./frontend:/app/frontend
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - DFM_BACKEND_URL=http://backend:8000
      - DFM_CONFIG=/app/config.yaml
      - PYVISTA_OFF_SCREEN=true
      - LOG_LEVEL=INFO
      # FIX C: without this, Docker (Linux) silently falls through to the
      # PyVista/stpyvista/Xvfb renderer while local macOS dev uses the
      # interactive Plotly viewer (`_USE_PLOTLY_VIEWER` in frontend/app.py
      # checks `sys.platform == "darwin"` first) — same backend data, two
      # different viewer UX depending on where you run it. Forcing Plotly
      # here makes both environments render identically; `plotly==5.21.0`
      # is already a Dockerfile.frontend dependency, no image change needed.
      - DFM_FORCE_PLOTLY=1
    depends_on:
      - backend

volumes:
  reports_data:
