[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    unit: Pure unit tests — no OCC, no files needed. Always fast.
    integration: Requires Part1.stp and pythonocc-core installed.
    slow: Long-running tests (Boolean ops, full pipeline).

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:reports/coverage_html
    --cov-fail-under=0

# Logging during tests
log_cli = true
log_cli_level = WARNING
log_cli_format = %(levelname)s %(name)s: %(message)s