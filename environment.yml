name: dfm_agent
channels:
  - conda-forge
  - cadquery

dependencies:
  # ── Core CAD/geometry ───────────────────────────────────────────────────
  - python=3.11
  - pythonocc-core=7.7.2
  - cadquery=2.4.0

  # ── Scientific ───────────────────────────────────────────────────────────
  - numpy=1.26.4
  - scipy=1.13.0

  # ── Visualisation (VTK backend for PyVista) ─────────────────────────────
  - vtk=9.2.*

  # ── Utilities ────────────────────────────────────────────────────────────
  # pip-installable packages are NOT duplicated here. requirements.txt is
  # the single canonical source for them (this file previously pinned
  # openai==1.25.0, which is known-broken against modern httpx -- see
  # requirements.txt's own comment on that pin). After creating this
  # environment, install the rest with:
  #   conda activate dfm_agent && pip install -r requirements.txt
  - pip