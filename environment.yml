name: dfm_agent
channels:
  - conda-forge
  - cadquery

dependencies:
  # ── Core CAD/geometry ───────────────────────────────────────────────────
  - python=3.11
  - pythonocc-core=7.7.2
  - cadquery=2.4.0

  # ── Scientific ───────────────────────────────────────────────────────────
  - numpy=1.26.4
  - scipy=1.13.0

  # ── Visualisation (VTK backend for PyVista) ─────────────────────────────
  - vtk=9.2.*

  # ── Utilities ────────────────────────────────────────────────────────────
  - pip
  - pip:
      - streamlit==1.33.0
      - pyvista==0.44.1
      - stpyvista==0.0.11
      - plotly==5.21.0
      - langchain==0.1.20
      - langchain-openai==0.1.7
      - langchain-community==0.0.38
      - openai==1.25.0
      - pydantic==2.7.1
      - fastapi==0.111.0
      - uvicorn[standard]==0.29.0
      - PyYAML==6.0.1
      - rich==13.7.1
      - click==8.1.7
      - python-dotenv==1.0.1
      - networkx==3.3
      - reportlab==4.1.0
      - Pillow==10.3.0
      - pytest==8.2.0
      - pytest-cov==5.0.0